[project]
name = "chess-analytics"
version = "0.1.0"
description = "Platform for ingesting, analysing and visualising chess games from online platforms."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "chess>=1.11.2",
    "fastapi>=0.162.4",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import sorting, B: bugbear (likely bugs),
# UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real third-party APIs: excluded by default and in CI. Run with -m live.
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "integration: needs external services (Postgres via CHESS_TEST_DATABASE_URL)",
    "live: calls real third-party APIs over the network; opt-in only (pytest -m live)",
]
