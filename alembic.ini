# Alembic configuration. Run commands from the repository root, e.g.
#   uv run alembic upgrade head          apply all pending migrations
#   uv run alembic current               show the database's revision
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add x"
#
# The database URL is NOT configured here: migrations/env.py reads it from our
# application settings (CHESS_DATABASE_URL), so there is one source of configuration.
# Logging is configured by env.py through chess_analytics.logging_setup.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Files sort by date then revision: 2026_11_13-0001_create_layer_schemas.py
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Store revision timestamps in UTC, like everything else.
timezone = UTC

[post_write_hooks]
# Lint and format every newly generated migration with ruff (a dev dependency).
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
