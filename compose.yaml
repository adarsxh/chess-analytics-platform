# Local development stack.
#   docker compose up -d db     → only Postgres (daily dev: run the API natively with uv;
#                                 apply migrations with `uv run alembic upgrade head`)
#   docker compose up --build   → full stack: db → migrate (one-off) → api + worker → dashboard
#                                 (dashboard: http://127.0.0.1:8501)
#
# Values like ${POSTGRES_PASSWORD} are read from the .env file next to this one.

name: chess-analytics

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1: reachable from this machine only, not from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # One-off: applies pending migrations, then exits. api only starts if it succeeded.
    build: .
    image: ${CHESS_IMAGE:-chess-analytics:local}  # CI sets CHESS_IMAGE to its built image
    command: ["alembic", "upgrade", "head"]
    environment:
      CHESS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ${CHESS_IMAGE:-chess-analytics:local}  # CI sets CHESS_IMAGE to its built image
    environment:
      CHESS_ENV: local
      CHESS_LOG_LEVEL: ${CHESS_LOG_LEVEL:-INFO}
      # Inside the compose network the database host is the service name "db".
      CHESS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${CHESS_API_PORT:-8000}:8000"
    cpus: 1.0  # requests are short; leave the other cores to the workers
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    # Runs queued jobs: syncs and Stockfish analyses. One analysis uses one CPU core, so
    # each worker is capped at one core, and their number is CHESS_WORKERS in .env (or
    # `docker compose up --scale worker=8`); SKIP LOCKED keeps them apart. Docker Desktop's
    # own CPU limit (Settings → Resources) caps all containers together: raise it too.
    build: .
    image: ${CHESS_IMAGE:-chess-analytics:local}  # CI sets CHESS_IMAGE to its built image
    command: ["python", "-m", "chess_analytics.worker"]
    environment:
      CHESS_ENV: local
      CHESS_LOG_LEVEL: ${CHESS_LOG_LEVEL:-INFO}
      CHESS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `docker stop` sends SIGTERM, then SIGKILL after this grace period. A sync takes
    # ~25 s and an analysis ~40 s, so the current job can finish instead of being killed.
    stop_grace_period: 60s
    restart: unless-stopped
    cpus: 1.0
    deploy:
      replicas: ${CHESS_WORKERS:-1}

  dashboard:
    # Streamlit UI (frontend/, its own image). Talks to the API over HTTP only (ADR-005).
    build: ./frontend
    image: ${CHESS_DASHBOARD_IMAGE:-chess-analytics-dashboard:local}  # CI sets its built image
    environment:
      CHESS_DASHBOARD_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${CHESS_DASHBOARD_PORT:-8501}:8501"
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
